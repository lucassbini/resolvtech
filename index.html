<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resolv Tech // Visitas Operacionais</title>
<style>
:root{--bg:#07101d;--p:#0d1727;--p2:#111d30;--line:#25344b;--txt:#edf3fb;--muted:#91a0b4;--cyan:#00d7df;--green:#59df9d;--red:#ef4b59;--yellow:#e2ba45;--purple:#746ce8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px Segoe UI,Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:235px;background:#080f1b;border-right:1px solid #1d2a3d;padding:18px 14px;position:fixed;height:100vh;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 25px}.brand img{width:42px;height:42px;object-fit:contain}.brand small{display:block;color:var(--muted);letter-spacing:2px;font-size:9px;margin-top:3px}.nav button{display:block;width:100%;background:none;border:0;color:#a9b5c6;padding:12px;text-align:left;border-radius:7px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#202641;color:var(--cyan)}.main{margin-left:235px;width:calc(100% - 235px)}header{height:76px;border-bottom:1px solid #18263a;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:20px}header small{color:var(--muted)}.userbar{display:flex;align-items:center;gap:10px}.userbar .who{color:#d9e4f1;font-size:12px}.btn{background:#152339;border:1px solid var(--line);color:#dce6f2;border-radius:6px;padding:9px 12px;cursor:pointer}.btn:hover{border-color:#3a516e}.btn:disabled{opacity:.4;cursor:not-allowed}.content{padding:22px}.filters,.card{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:15px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.field label{display:block;color:#aab7c8;font-size:11px;margin-bottom:6px}.control{width:100%;height:38px;background:#0a1322;color:#edf3fb;border:1px solid #29384f;border-radius:6px;padding:0 10px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:16px}.kpi small{color:#8d9bae;letter-spacing:1px}.kpi b{display:block;font-size:27px;margin-top:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card h3{margin:0 0 13px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#aebaca}.donut{width:170px;height:170px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(var(--cyan) var(--pct),#202b3e 0);position:relative}.donut:after{content:"";width:118px;height:118px;border-radius:50%;background:var(--p)}.donut strong{position:absolute;z-index:1;font-size:27px}.center{text-align:center;color:var(--muted)}.stack-wrap{overflow:auto;padding-top:5px}.stack-chart{min-width:650px;height:235px;display:flex;align-items:flex-end;gap:20px;padding:10px 4px 0}.stack-col{flex:1;min-width:70px;text-align:center}.stack-total{color:#b7c3d1;font-size:10px;margin-bottom:6px}.stack-bar{height:175px;max-width:78px;margin:auto;display:flex;flex-direction:column;justify-content:flex-end;border-radius:5px 5px 0 0;overflow:hidden;background:#202b3e}.seg-real{background:var(--green);height:var(--rh)}.seg-pend{background:var(--purple);height:var(--ph)}.stack-col span{display:block;color:#9aa7b8;font-size:10px;margin-top:8px}.legend{display:flex;gap:15px;justify-content:center;color:#9aa7b8;font-size:11px;margin-top:6px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.dot.real{background:var(--green)}.dot.pend{background:var(--purple)}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #1c293b;text-align:left}th{font-size:10px;color:#8492a6;letter-spacing:1px}td{color:#dbe4ee}.pill{padding:4px 8px;border:1px solid;border-radius:20px;font-size:10px;white-space:nowrap}.ok{color:var(--green);border-color:#286c54}.no{color:#ff6874;border-color:#6e303a}.part{color:var(--yellow);border-color:#6b5a25}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:#087f86}.danger{background:#34151b;color:#ff7882}.hidden{display:none!important}.muted{color:var(--muted)}.subtle{font-size:11px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:9}.modal>div{width:min(760px,94vw);max-height:90vh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:10px;padding:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.super-card{cursor:pointer;transition:.15s}.super-card:hover{border-color:var(--cyan);transform:translateY(-1px)}.super-meta{color:var(--muted);font-size:11px;line-height:1.5}.regional-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.region-card{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:15px}.route-super{border:1px solid #24344b;border-radius:9px;margin-bottom:12px;overflow:hidden;background:#0b1524}.route-super-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;background:#0f1a2b}.route-super-head:hover{background:#122035}.route-super-head .name{font-weight:700}.route-super-head .summary{display:flex;align-items:center;gap:10px;color:#a9b8ca;font-size:12px;flex-wrap:wrap;justify-content:flex-end}.route-super-body{padding:0 12px 12px}.route-actions{display:flex;gap:5px;flex-wrap:wrap}.route-actions .btn{padding:6px 8px;font-size:11px}.date-list{display:flex;flex-wrap:wrap;gap:6px}.date-chip{display:inline-flex;align-items:center;gap:5px;background:#122034;border:1px solid #284059;border-radius:999px;padding:5px 9px;font-size:11px}.date-chip button{border:0;background:none;color:#ff7580;cursor:pointer;font-weight:bold}.detail-box{background:#0a1322;border:1px solid #22334a;border-radius:7px;padding:10px;margin-top:10px}.visits-line{line-height:1.7}.fullscreen{position:fixed;inset:0;background:#06101c;z-index:20;display:flex;flex-direction:column;padding:26px}.fullscreen-header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.fullscreen-brand{display:flex;align-items:center;gap:10px}.fullscreen-brand img{width:74px}.fullscreen-title{font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}.slide-dots{display:flex;gap:6px;flex-wrap:wrap}.slide-dot{width:8px;height:8px;border-radius:50%;background:#314058}.slide-dot.active{background:var(--cyan)}.full-layout{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;flex:1;min-height:0}.full-main,.full-side{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:20px;overflow:auto}.hero-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.hero-kpi{background:#0a1322;border:1px solid #24344b;border-radius:9px;padding:12px}.hero-kpi small{display:block;color:var(--muted);font-size:10px}.hero-kpi b{font-size:24px;display:block;margin-top:6px}.supervisor-hero{font-size:30px;font-weight:700;margin-bottom:5px}.progress{height:14px;background:#202b3e;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:var(--w)}.full-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:11px}.print-only{display:none}
.login{position:fixed;inset:0;background:#050b14;display:grid;place-items:center;z-index:10}.loginbox{width:380px;background:var(--p);border:1px solid var(--line);border-radius:12px;padding:28px}.loginbox img{width:160px;display:block;margin:auto}.loginbox h2{text-align:center}.loginbox p{text-align:center;color:var(--muted)}.loginbox .btn{width:100%;margin-top:10px}
@media(max-width:1100px){.filters,.kpis{grid-template-columns:1fr 1fr}.grid,.full-layout{grid-template-columns:1fr}.hero-kpis{grid-template-columns:1fr 1fr}.regional-grid{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%}.filters,.kpis,.two,.three,.hero-kpis,.regional-grid{grid-template-columns:1fr}.content{padding:10px}header{padding:14px;height:auto;gap:10px}.loginbox{width:92vw}.route-super-head{align-items:flex-start}.route-super-head .summary{justify-content:flex-start}.table-wrap{overflow:auto}.full-layout{display:block}.full-side{margin-top:12px}.fullscreen{padding:12px}.supervisor-hero{font-size:24px}}
@media print{.report-detail.hidden{display:block!important}body{background:#fff;color:#111}.side,body> .login,header,.actions,.filters,.print-hide{display:none!important}.main{margin:0;width:100%}.content{padding:0}.card{background:#fff;border:0;color:#111;padding:0}.card h3,th,td,.muted,.subtle{color:#333}.print-only{display:block}.report-print-logo{height:48px}.route-super{background:#fff;border:1px solid #ccc}.route-super-head{background:#f5f5f5;color:#111}.route-super-body{padding:0}.pill{color:#111!important;border-color:#888!important}.report-table th,.report-table td{color:#111!important;border-bottom:1px solid #ccc}.report-detail{background:#fafafa;border:1px solid #ddd;color:#111}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><img src="logo.JPG"><h2>Resolv Tech</h2><p>Visitas Operacionais</p><div class="field"><label>Usuário</label><input id="u" class="control" value="admin"></div><div class="field"><label>Senha</label><input id="pw" class="control" type="password" value="admin"></div><button class="btn primary" onclick="doLogin()">Entrar</button><p id="err" style="color:#ff6874"></p></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand"><img src="logo.JPG"><div><b>Resolv Tech</b><small>VISITAS OPERACIONAIS</small></div></div><div class="nav"><button data-p="dash" onclick="page('dash')">▦ Dashboard</button><button data-p="posts" onclick="page('posts')">♙ Postos</button><button data-p="sups" onclick="page('sups')">♧ Supervisores</button><button data-p="route" onclick="page('route')">✓ Roteiro</button><button data-p="report" onclick="page('report')">▤ Relatórios</button><button id="usersNav" onclick="users()">⚙ Usuários</button></div></aside>
<main class="main"><header><div><h1 id="title">Centro de Controle Operacional</h1><small id="sub">Visitas programadas x realizadas</small></div><div class="userbar"><span class="who" id="who"></span><button class="btn" onclick="logout()">Sair</button></div></header><section id="content" class="content"></section></main></div>
<div id="modal" class="modal hidden"></div><div id="fullscreen" class="fullscreen hidden"></div>
<script>
let S={token:"",user:null,posts:[],sups:[],routes:[],visits:[],regions:[],users:[]},currentPage="dash",filters={region:"",sup:"",post:"",month:new Date().toISOString().slice(0,7)},routeOpen={};
const $=id=>document.getElementById(id);
const api=async(u,o={})=>{o.headers=Object.assign({"Content-Type":"application/json"},o.headers||{},S.token?{"Authorization":"Bearer "+S.token}:{});let r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Erro");return d};
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmtDate=d=>{if(!d)return "";const [y,m,day]=String(d).slice(0,10).split("-");return `${day}/${m}/${y}`};
const fmtMonth=m=>{if(!m)return "Todos";const [y,mo]=m.split("-");return `${mo}/${y}`};
const monthLong=m=>{if(!m)return "Todos";const [y,mo]=m.split("-");const names=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];return `${names[Number(mo)-1]||mo} de ${y}`};
const listRouteData=()=>S.routes.map(r=>({...r,sup:S.sups.find(s=>s.id==r.supervisor_id),post:S.posts.find(p=>p.id==r.post_id),dates:S.visits.filter(v=>v.route_id==r.id).map(v=>v.visit_date).sort()})).filter(x=>x.sup&&x.post);
function filteredRoutes(base=listRouteData()){return base.filter(r=>(!filters.region||r.post.region===filters.region)&&(!filters.sup||r.sup.id==filters.sup)&&(!filters.post||r.post.id==filters.post))}
function select(list,val="",all="Todos"){return `<select class="control"><option value="">${all}</option>${list.map(x=>`<option value="${esc(x)}" ${String(x)===String(val)?"selected":""}>${esc(x)}</option>`).join("")}</select>`}
function metrics(rs,month=""){let p=rs.reduce((a,r)=>a+Number(r.planned||0),0);let v=rs.reduce((a,r)=>a+r.dates.filter(d=>!month||d.startsWith(month)).length,0);return{p,v,pct:p?Math.min(100,v/p*100):0,realStatus:rs.filter(r=>r.planned>0&&r.dates.filter(d=>!month||d.startsWith(month)).length>=r.planned).length,notStatus:rs.filter(r=>r.planned>0&&r.dates.filter(d=>!month||d.startsWith(month)).length<r.planned).length}}
function statusFor(p,v){return p>0&&v>=p?"REALIZADA":"NÃO REALIZADA"}
async function doLogin(){try{let x=await api("/api/login",{method:"POST",body:JSON.stringify({username:$('u').value,password:$('pw').value})});S.token=x.token;S.user=x.user;localStorage.setItem("rt_token",S.token);await load();$('login').classList.add("hidden");$('app').classList.remove("hidden");$('who').textContent=`${S.user.name} · ${S.user.username}`;$('usersNav').classList.toggle("hidden",S.user.role!=="admin");page("dash")}catch(e){$('err').textContent=e.message}}
async function load(){let x=await api("/api/bootstrap");Object.assign(S,x)}
function logout(){S.token="";localStorage.removeItem("rt_token");location.reload()}
function page(p){currentPage=p;document.querySelectorAll(".nav button[data-p]").forEach(x=>x.classList.toggle("active",x.dataset.p===p));({dash,sups,posts,route,report}[p])()}
function dash(){let rs=filteredRoutes(),m=metrics(rs,filters.month);$('title').textContent="Centro de Controle Operacional";$('sub').textContent="Visitas programadas x realizadas";const regions=S.regions.filter(r=>rs.some(z=>z.post.region===r));$('content').innerHTML=`
<div class="filters"><div class="field"><label>Supervisor</label>${select(S.sups.map(x=>x.name),S.sups.find(x=>x.id==filters.sup)?.name||"")}</div><div class="field"><label>Posto</label>${select(S.posts.map(x=>x.name),S.posts.find(x=>x.id==filters.post)?.name||"")}</div><div class="field"><label>Regional</label>${select(S.regions,filters.region)}</div><div class="field"><label>Mês das visitas</label><input id="month" class="control" type="month" value="${filters.month}"></div></div>
<div class="actions" style="margin-bottom:14px"><button class="btn primary" onclick="startFullscreen()">⛶ Visualização completa</button><span class="subtle">Exibição automática de todos os supervisores • 10 segundos por supervisor</span></div>
<div class="kpis"><div class="kpi"><small>POSTOS</small><b>${new Set(rs.map(r=>r.post.id)).size}</b></div><div class="kpi"><small>VISITAS PROGRAMADAS</small><b>${m.p}</b></div><div class="kpi"><small>VISITAS REALIZADAS</small><b style="color:var(--green)">${m.v}</b></div><div class="kpi"><small>ATINGIMENTO</small><b style="color:var(--cyan)">${Math.round(m.pct)}%</b></div></div>
<div class="grid"><div class="card"><h3>Atingimento do mês</h3><div class="donut" style="--pct:${m.pct*3.6}deg"><strong>${Math.round(m.pct)}%</strong></div><div class="center">${m.v} realizadas de ${m.p} programadas</div><div class="info-strip" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px"><div class="mini"><small>Realizadas</small><b style="color:var(--green)">${m.realStatus}</b></div><div class="mini"><small>Não realizadas</small><b style="color:var(--red)">${m.notStatus}</b></div></div></div>
<div class="card"><h3>Programadas x realizadas por regional</h3><div class="stack-wrap"><div class="stack-chart">${regions.map(r=>{let x=metrics(rs.filter(z=>z.post.region===r),filters.month);let total=Math.max(x.p,x.v,1);let rh=Math.max(0,175*x.v/total);let ph=Math.max(0,175*Math.max(0,x.p-x.v)/total);return `<div class="stack-col"><div class="stack-total">${x.v}/${x.p}</div><div class="stack-bar"><div class="seg-real" style="--rh:${rh}px"></div><div class="seg-pend" style="--ph:${ph}px"></div></div><span>${esc(r)}</span></div>`}).join("")||'<div class="muted">Nenhum dado no filtro selecionado.</div>'}</div></div><div class="legend"><span><i class="dot real"></i>Realizadas</span><span><i class="dot pend"></i>Ainda não realizadas</span></div></div></div>
<div class="card" style="margin-top:14px"><div class="title"><h3>Situação dos Postos</h3><b>Realizadas: ${m.realStatus} · Não realizadas: ${m.notStatus}</b></div><table><thead><tr><th>Supervisor</th><th>Usuário de acesso</th><th>Regional</th><th>Programadas</th><th>Realizadas</th><th>%</th><th>Situação</th></tr></thead><tbody>${[...new Set(rs.map(r=>r.sup.id))].map(id=>{let s=S.sups.find(x=>x.id==id),x=metrics(rs.filter(r=>r.sup.id==id),filters.month),st=statusFor(x.p,x.v);return `<tr><td>${esc(s.name)}</td><td>${esc(s.access_username||"—")}</td><td>${esc(s.region)}</td><td>${x.p}</td><td>${x.v}</td><td style="color:var(--cyan)">${Math.round(x.pct)}%</td><td><span class="pill ${st==="REALIZADA"?"ok":"no"}">${st}</span></td></tr>`}).join("")||'<tr><td colspan="7" class="muted">Nenhum roteiro encontrado.</td></tr>'}</tbody></table></div>`;
const ss=$('content').querySelectorAll('.filters select');ss[0].onchange=e=>{filters.sup=S.sups.find(x=>x.name===e.target.value)?.id||"";dash()};ss[1].onchange=e=>{filters.post=S.posts.find(x=>x.name===e.target.value)?.id||"";dash()};ss[2].onchange=e=>{filters.region=e.target.value;dash()};$('month').onchange=e=>{filters.month=e.target.value;dash()}}
function posts(){
 $('title').textContent="Postos";$('sub').textContent="Cadastro e manutenção dos postos";
 $('content').innerHTML=`<div class="card"><div class="title"><h3>Cadastro de posto</h3></div><div class="two"><div class="field"><label>Nome do Posto</label><input id="pn" class="control" placeholder="Digite o nome do posto"></div><div class="field"><label>Regional</label><input id="pr" class="control" placeholder="Digite a regional"></div></div><div style="margin-top:10px"><button class="btn primary" onclick="addPost()">Adicionar Posto</button></div></div><div class="card" style="margin-top:14px"><input id="pq" class="control" placeholder="Filtrar posto ou regional" oninput="postTable()"><div id="ptable" style="margin-top:10px"></div></div>`;postTable();}
function postTable(){let qv=($('pq')?.value||"").toLowerCase();$('ptable').innerHTML=`<table><thead><tr><th>Posto</th><th>Regional</th><th>Ações</th></tr></thead><tbody>${S.posts.filter(p=>p.name.toLowerCase().includes(qv)||p.region.toLowerCase().includes(qv)).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.region)}</td><td><button class="btn" onclick="editPost(${p.id})">Editar</button> <button class="btn danger" onclick="delPost(${p.id})">Excluir</button></td></tr>`).join("")||'<tr><td colspan="3" class="muted">Nenhum posto cadastrado.</td></tr>'}</tbody></table>`}
async function addPost(){if(!$('pn').value.trim()||!$('pr').value.trim())return alert("Informe o nome do posto e a regional.");await api("/api/posts",{method:"POST",body:JSON.stringify({name:$('pn').value,region:$('pr').value})});await load();posts()}
async function delPost(id){if(confirm("Excluir posto?")){await api("/api/posts/"+id,{method:"DELETE"});await load();posts()}}
function editPost(id){let p=S.posts.find(x=>x.id==id);modal(`<h3>Editar posto</h3><div class="field"><label>Nome do Posto</label><input id="en" class="control" value="${esc(p.name)}"></div><div class="field"><label>Regional</label><input id="er" class="control" value="${esc(p.region)}"></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="savePost(${id})">Salvar</button></div>`)}
async function savePost(id){await api("/api/posts/"+id,{method:"PUT",body:JSON.stringify({name:$('en').value,region:$('er').value})});close();await load();posts()}
function sups(){
 $('title').textContent="Supervisores";$('sub').textContent="Regionais separadas — clique no supervisor para acompanhar a operação";
 const regions=[...S.regions];
 $('content').innerHTML=`<div class="card"><div class="title"><h3>Supervisores e Regionais</h3><div class="actions"><button class="btn" onclick="regionManager()">⚙ Gerenciar Regionais</button><button class="btn primary" onclick="addSupModal()">+ Adicionar Supervisor</button></div></div><div class="subtle">Cada supervisor pode ter um usuário de acesso associado. Essa associação também aparece no Dashboard.</div></div><div class="regional-grid">${regions.map(r=>`<div class="region-card"><div class="title"><h3>${esc(r)}</h3><span class="subtle">${S.sups.filter(s=>s.region===r).length} supervisor(es)</span></div>${S.sups.filter(s=>s.region===r).map(s=>{let x=metrics(listRouteData().filter(z=>z.sup.id==s.id),filters.month);return `<div class="super-card" onclick="superDetail(${s.id})" style="padding:11px;border:1px solid #24344b;border-radius:8px;margin-bottom:8px"><b>${esc(s.name)}</b><div class="super-meta">Usuário de acesso: ${esc(s.access_username||"—")}<br>Programadas: ${x.p} · Realizadas: ${x.v} · ${Math.round(x.pct)}%</div><div style="margin-top:8px" class="actions"><button class="btn" onclick="event.stopPropagation();editSup(${s.id})">Editar</button><button class="btn danger" onclick="event.stopPropagation();delSup(${s.id})">Excluir</button></div></div>`}).join("")||'<span class="muted">Nenhum cadastrado.</span>'}</div>`).join("")}</div>`;
}
function addSupModal(){modal(`<h3>Adicionar Supervisor</h3><div class="field"><label>Nome do Supervisor</label><input id="sn" class="control" placeholder="Digite o nome"></div><div class="field"><label>Regional</label>${select(S.regions)}</div><div class="field"><label>Usuário de acesso</label>${select(S.users.map(u=>u.username))}</div><div class="subtle" style="margin-top:8px">O usuário selecionado passa a ser exibido no Dashboard junto ao supervisor.</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="addSup()">Salvar Supervisor</button></div>`)}

r(d=>!filters.month||d.startsWith(filters.month)).map(d=>{let v=S.visits.find(v=>v.route_id==r.id&&v.visit_date===d);return `<span class="date-chip">${fmtDate(d)} <button title="Excluir visita" onclick="event.stopPropagation();deleteVisit(${v?.id})">×</button></span>`}).join("")||'<span class="muted">—</span>'}</div></td><td><div class="route-actions"><button class="btn" onclick="event.stopPropagation();routeEdit(${r.id})">Editar</button><button class="btn danger" onclick="event.stopPropagation();routeDelete(${r.id})">Excluir</button><button class="btn primary" onclick="event.stopPropagation();visit(${r.id})">+ Visita</button></div></td></tr>`}).join("")||'<tr><td colspan="8" class="muted">Nenhum roteiro para este filtro.</td></tr>'}</tbody></table></div></div></div>`}).join("")||'<div class="card"><span class="muted">Nenhum roteiro cadastrado.</span></div>'}</div>`;

 $('title').textContent="Relatório";$('sub').textContent="Relatório de Visitas Operacionais";
 $('content').innerHTML=`<div class="filters print-hide"><div class="field"><label>Regional</label>${select(S.regions)}</div><div class="field"><label>Posto</label>${select(S.posts.map(x=>x.name))}</div><div class="field"><label>Supervisor</label>${select(S.sups.map(x=>x.name))}</div><div class="field"><label>Período de</label><input id="rf" type="date" class="control"></div><div class="field"><label>Até</label><input id="rt" type="date" class="control"></div></div><div class="actions print-hide" style="margin-bottom:14px"><button class="btn" onclick="clearReport()">Limpar filtros</button><button class="btn primary" onclick="window.print()">▧ Gerar relatório em PDF</button></div><div class="card" id="rep"></div>`;
 let ss=document.querySelectorAll(".filters select"),f={region:"",post:"",sup:"",from:"",to:""};ss[0].onchange=e=>{f.region=e.target.value;renderRep(f)};ss[1].onchange=e=>{f.post=S.posts.find(x=>x.name===e.target.value)?.id||"";renderRep(f)};ss[2].onchange=e=>{f.sup=S.sups.find(x=>x.name===e.target.value)?.id||"";renderRep(f)};$('rf').onchange=e=>{f.from=e.target.value;renderRep(f)};$('rt').onchange=e=>{f.to=e.target.value;renderRep(f)};window.currentReportFilters=f;renderRep(f)
}

function renderRep(f){let base=listRouteData().filter(r=>(!f.region||r.post.region===f.region)&&(!f.post||r.post.id==f.post)&&(!f.sup||r.sup.id==f.sup));let grouped={};base.forEach(r=>(grouped[r.sup.id]??=[]).push({...r,dates:r.dates.filter(d=>(!f.from||d>=f.from)&&(!f.to||d<=f.to))}));let rows=Object.entries(grouped);let p=base.reduce((a,r)=>a+r.planned,0),v=rows.reduce((a,[,rs])=>a+rs.reduce((b,r)=>b+r.dates.length,0),0),pct=p?Math.round(v/p*100):0;
 $('rep').innerHTML=`<div class="print-only"><img src="logo.JPG" class="report-print-logo"><h1 style="margin:10px 0 4px;color:#111">Relatório de Visitas Operacionais</h1><div style="color:#555;font-size:12px">Emitido em ${fmtDate(new Date().toISOString().slice(0,10))}</div></div><div class="title"><div><h3>Resultado</h3><div class="muted">Relatório de Visitas Operacionais</div></div><b>Programadas ${p} &nbsp; Realizadas ${v} &nbsp; Geral ${pct}%</b></div><table class="report-table"><thead><tr><th></th><th>Supervisor</th><th>Regional</th><th>Programadas</th><th>Realizadas</th><th>%</th><th>Situação</th></tr></thead><tbody>${rows.map(([sid,rs],idx)=>{let s=rs[0].sup,m=metrics(rs),st=statusFor(m.p,m.v);return `<tr><td><button class="btn print-hide" onclick="document.getElementById('rd${idx}').classList.toggle('hidden')">+</button></td><td><b>${esc(s.name)}</b><div class="subtle">Usuário de acesso: ${esc(s.access_username||"—")}</div></td><td>${esc(s.region)}</td><td>${m.p}</td><td>${m.v}</td><td style="color:var(--cyan)">${Math.round(m.pct)}%</td><td><span class="pill ${st==='REALIZADA'?'ok':'no'}">${st}</span></td></tr><tr id="rd${idx}" class="hidden"><td></td><td colspan="6"><div class="report-detail"><div class="subtle" style="margin-bottom:8px">Detalhamento do supervisor — ${esc(s.name)}</div><table><thead><tr><th>Posto</th><th>Mês</th><th>Programadas</th><th>Realizadas</th><th>%</th><th>Situação</th><th>Visitas Operacionais</th></tr></thead><tbody>${rs.map(r=>{let pp=r.planned,rr=r.dates.length,pc=pp?Math.min(100,rr/pp*100):0,ss=statusFor(pp,rr);return `<tr><td>${esc(r.post.name)}</td><td>${monthLong(f.from?f.from.slice(0,7):filters.month)}</td><td>${pp}</td><td>${rr}</td><td>${Math.round(pc)}%</td><td><span class="pill ${ss==='REALIZADA'?'ok':'no'}">${ss}</span></td><td>${r.dates.map(fmtDate).join(", ")||"Nenhuma visita registrada"}</td></tr>`}).join("")}</tbody></table></div></td></tr>`}).join("")||'<tr><td colspan="7" class="muted">Nenhum dado encontrado.</td></tr>'}</tbody></table>`
}

iv></div><div class="full-footer"><span>Supervisor ${slideIndex+1} de ${S.sups.length}</span><span>Troca automática a cada 10 segundos</span></div>`}
